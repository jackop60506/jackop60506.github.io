<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Vibecoding 儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        .selection-purple::selection {
            background-color: rgba(147, 51, 234, 0.3);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-sans selection-purple">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-purple-600 rounded-lg shadow-lg shadow-purple-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-5c1.62-2.2 5-3 5-3"/><path d="M12 15v5s3.03-.55 5-2c2.2-1.62 3-5 3-5"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                        Antigravity Vibecoding
                    </h1>
                    <p class="text-xs text-slate-500">Laravel + Vue 極速開發指南</p>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-4 text-sm text-slate-400">
                <span class="flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    v1.0 Docs
                </span>
                <span class="h-4 w-[1px] bg-slate-800"></span>
                <span class="text-purple-400 font-medium">Gemini 2.5 Ready</span>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-6 py-8 flex flex-col md:flex-row gap-8">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 flex-shrink-0">
            <nav id="sidebar-nav" class="space-y-1">
                <!-- Nav items will be rendered here -->
            </nav>

            <div class="mt-8 p-4 bg-slate-900 rounded-2xl border border-slate-800">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">當前狀態</h3>
                <div class="flex items-center gap-2 text-sm text-green-400 mb-2">
                    <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
                    並行代理：Active
                </div>
                <p class="text-xs text-slate-500 leading-relaxed">
                    Gemini 已載入上下文，隨時準備執行意圖驅動指令。
                </p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 min-w-0">
            <div id="content-area" class="bg-slate-900/40 border border-slate-800 rounded-3xl p-8 shadow-sm">
                <!-- Content will be rendered here -->
            </div>

            <!-- Footer Card -->
            <div class="mt-8 p-6 bg-gradient-to-br from-purple-900/20 to-slate-900 border border-purple-500/20 rounded-3xl flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-purple-600/20 rounded-2xl">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-400"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-200">準備好開啟 Antigravity 模式了嗎？</h4>
                        <p class="text-xs text-slate-400">將文件貼給 Gemini，開始你的極速 Vibecoding 旅程。</p>
                    </div>
                </div>
                <button onclick="switchTab('pipeline')" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-purple-900/20 transition-all active:scale-95">
                    開始初始化項目
                </button>
            </div>
        </main>
    </div>

    <script>
        // --- Data ---
        const sections = [
            { id: 'philosophy', title: '核心哲學', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>` },
            { id: 'structure', title: '目錄結構', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 14v8H2v-8"/><path d="M2 10V2h20v8"/><rect x="10" y="6" width="4" height="4"/></svg>` },
            { id: 'pipeline', title: '開發流水線', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="2" y1="15" x2="4" y2="15"/><line x1="20" y1="15" x2="22" y2="15"/></svg>` },
            { id: 'maintenance', title: '維護機制', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>` },
            { id: 'snapshot', title: '進度快照', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>` },
            { id: 'tools', title: '工具指令', icon: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>` },
        ];

        let activeTab = 'philosophy';

        // --- Core Functions ---

        function handleCopy(btn, text) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const originalHTML = btn.innerHTML;
            btn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><polyline points="20 6 9 17 4 12"/></svg>
                已複製
            `;
            setTimeout(() => {
                btn.innerHTML = originalHTML;
            }, 2000);
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = sections.map(section => `
                <button
                    onclick="switchTab('${section.id}')"
                    class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                        activeTab === section.id 
                        ? 'bg-purple-600/10 text-purple-400 border border-purple-500/20 shadow-[0_0_15px_rgba(147,51,234,0.1)]' 
                        : 'text-slate-500 hover:text-slate-300 hover:bg-slate-900 border border-transparent'
                    }"
                >
                    <div class="flex items-center gap-3">
                        ${section.icon}
                        ${section.title}
                    </div>
                    ${activeTab === section.id ? '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' : ''}
                </button>
            `).join('');
        }

        function switchTab(id) {
            activeTab = id;
            renderSidebar();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getCopyBtn(text) {
            return `
                <button 
                    onclick="handleCopy(this, \`${text}\`)"
                    class="flex items-center gap-1 text-xs bg-slate-700 hover:bg-slate-600 transition-colors px-2 py-1 rounded border border-slate-500 text-slate-300"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    複製指令
                </button>
            `;
        }

        function renderContent() {
            const area = document.getElementById('content-area');
            let html = '';

            switch(activeTab) {
                case 'philosophy':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                核心開發哲學
                            </h2>
                            <div class="grid gap-6">
                                <div class="p-5 bg-slate-800/50 rounded-2xl border border-slate-700/50 hover:border-purple-500/30 transition-all">
                                    <h4 class="text-purple-400 font-semibold mb-2">意圖驅動 (Intent-Driven)</h4>
                                    <p class="text-slate-400 text-sm leading-relaxed">你定義「為什麼」與「做什麼」，AI 負責技術細節「怎麼做」。</p>
                                </div>
                                <div class="p-5 bg-slate-800/50 rounded-2xl border border-slate-700/50 hover:border-purple-500/30 transition-all">
                                    <h4 class="text-purple-400 font-semibold mb-2">文件即真理 (Docs as Truth)</h4>
                                    <p class="text-slate-400 text-sm leading-relaxed">Code 是規格的副產品。任何修改必須先在 docs/ 更新規格，再同步程式碼。</p>
                                </div>
                                <div class="p-5 bg-slate-800/50 rounded-2xl border border-slate-700/50 hover:border-purple-500/30 transition-all">
                                    <h4 class="text-purple-400 font-semibold mb-2">並行開發 (Parallel Agents)</h4>
                                    <p class="text-slate-400 text-sm leading-relaxed">模擬三個角色：架構師 (docs)、後端 (API)、前端 (UI)，透過合約同步。</p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'structure':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400"><path d="M22 14v8H2v-8"/><path d="M2 10V2h20v8"/><rect x="10" y="6" width="4" height="4"/></svg>
                                AI-Ready 專案結構
                            </h2>
                            <div class="bg-slate-950 rounded-2xl p-6 font-mono text-sm border border-slate-800 overflow-x-auto">
                                <div class="space-y-1">
                                    <div class="text-slate-300">/</div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <span class="text-slate-600">├──</span>
                                        <span class="text-green-400 font-bold">GUIDELINES.md</span>
                                        <span class="text-slate-500 italic">// 專案憲法</span>
                                    </div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <span class="text-slate-600">├──</span>
                                        <span class="text-blue-400">docs/</span>
                                        <span class="text-slate-500 italic">// 專案大腦</span>
                                    </div>
                                    <div class="flex items-center gap-2 ml-10">
                                        <span class="text-slate-600">├──</span>
                                        <span class="text-slate-300">user_stories.md</span>
                                    </div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <span class="text-slate-600">├──</span>
                                        <span class="text-orange-400">app/Services</span>
                                        <span class="text-slate-500 italic">// 邏輯隔離區</span>
                                    </div>
                                    <div class="flex items-center gap-2 ml-4">
                                        <span class="text-slate-600">└──</span>
                                        <span class="text-pink-400 text-xs">resources/js/types</span>
                                        <span class="text-slate-500 italic text-xs">// 前端型別定義</span>
                                    </div>
                                </div>
                            </div>
                            <p class="mt-6 text-sm text-slate-500">※ 維持此結構能讓 Gemini 在數秒內掌握專案全貌，極大幅度地減少幻覺。</p>
                        </div>
                    `;
                    break;
                case 'pipeline':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="2" y1="15" x2="4" y2="15"/><line x1="20" y1="15" x2="22" y2="15"/></svg>
                                三階段極速開發流水線
                            </h2>
                            <div class="space-y-8 relative before:absolute before:left-[15px] before:top-2 before:bottom-2 before:w-[2px] before:bg-slate-800">
                                <div class="relative pl-10">
                                    <div class="absolute left-0 top-1 w-8 h-8 rounded-full bg-slate-900 border-2 border-slate-700 flex items-center justify-center text-xs font-bold z-10">1</div>
                                    <h3 class="font-bold text-slate-200 mb-2">初始化專案憲法</h3>
                                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs text-slate-500 font-mono">PROMPT:</span>
                                            ${getCopyBtn("請幫我初始化 GUIDELINES.md。技術棧為 Laravel 11 與 Vue 3 (Composition API)。規範：使用 Service Pattern、強型別、所有 API 需有 Swagger 註解、測試使用 Pest。請確保代碼風格一致。")}
                                        </div>
                                    </div>
                                </div>
                                <div class="relative pl-10">
                                    <div class="absolute left-0 top-1 w-8 h-8 rounded-full bg-slate-900 border-2 border-slate-700 flex items-center justify-center text-xs font-bold z-10">2</div>
                                    <h3 class="font-bold text-slate-200 mb-2">產出規格</h3>
                                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-xs text-slate-500 font-mono">PROMPT:</span>
                                            ${getCopyBtn("我要做 [專案名]。核心功能為 [A, B, C]。請產出 docs/user_stories.md 與 docs/schema.md (Mermaid)。請發揮你的專業補全細節，並列出你的假設供我確認。")}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'maintenance':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                                維護機制
                            </h2>
                            <div class="bg-slate-800/30 rounded-2xl border border-slate-700 p-6 mb-6">
                                <h3 class="font-bold mb-4 flex items-center gap-2">Vibe Check 校準</h3>
                                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 relative">
                                    <div class="absolute right-4 top-4">
                                        ${getCopyBtn("請掃描目前的 app/Services 與 docs/schema.md。是否有任何不一致的地方？如果有，請條列出來並修正，確保程式碼完全符合 GUIDELINES.md。")}
                                    </div>
                                    <p class="text-sm font-mono text-slate-300 pr-20 leading-relaxed">
                                        「請掃描目前的 app/Services 與 docs/schema.md...」
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'snapshot':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-400"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                進度快照 (Snapshot)
                            </h2>
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                                <div class="p-4 bg-slate-800/50 border-b border-slate-800 flex justify-between items-center">
                                    <span class="text-xs font-mono text-slate-400">對話重啟前必執行</span>
                                    ${getCopyBtn("根據今日開發內容，更新 docs/progress.md。包含：1. 已完成的功能清單。2. 已知但未解決的 Bug。3. 建議下一個開發步驟。")}
                                </div>
                                <div class="p-6 text-sm text-slate-400">
                                    防止對話上下文過長導致 AI 遺忘細節，並為下次對話提供起始點。
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'tools':
                    html = `
                        <div class="animate-in">
                            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                                工具指令
                            </h2>
                            <div class="grid gap-4">
                                <div class="group p-4 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                                    <div><div class="text-emerald-400 font-mono text-sm">composer lint</div></div>
                                    ${getCopyBtn("composer lint")}
                                </div>
                                <div class="group p-4 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between">
                                    <div><div class="text-emerald-400 font-mono text-sm">php artisan test</div></div>
                                    ${getCopyBtn("php artisan test")}
                                </div>
                            </div>
                        </div>
                    `;
                    break;
            }

            area.innerHTML = html;
        }

        // --- Init ---
        window.onload = () => {
            renderSidebar();
            renderContent();
        };
    </script>
</body>
</html>
